# Template: merge into /etc/open5gs/mme.yaml
mme:
  freeDiameter: /etc/freeDiameter/mme.conf
  s1ap:
    - addr: 127.0.1.100
  gtpc:
    - addr: 127.0.0.2
  gummei:
    - plmn_id: { mcc: 001, mnc: 01 }
      mme_gid: 2
      mme_code: 1
  tai:
    - plmn_id: { mcc: 001, mnc: 01 }
      tac: 1
  security:
    integrity_order: [ EIA2, EIA1, EIA0 ]
    ciphering_order: [ EEA0, EEA1, EEA2 ]
