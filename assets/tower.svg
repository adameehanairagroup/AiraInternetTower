<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="60" cy="60" r="54" fill="#0b1736" stroke="#2563eb" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="60" cy="60" r="48" fill="#070e24"/>

  <!-- Radiating Radio Waves (Left & Right) -->
  <path d="M 44 26 A 22 22 0 0 0 44 48" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 37 19 A 32 32 0 0 0 37 55" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 30 12 A 44 44 0 0 0 30 62" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>

  <path d="M 76 26 A 22 22 0 0 1 76 48" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 83 19 A 32 32 0 0 1 83 55" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 90 12 A 44 44 0 0 1 90 62" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>

  <!-- Tower Mast Legs -->
  <path d="M 52 38 L 36 102" stroke="url(#towerGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 68 38 L 84 102" stroke="url(#towerGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Cross Bracing Lattice -->
  <line x1="50" y1="48" x2="70" y2="48" stroke="#38bdf8" stroke-width="2"/>
  <line x1="46" y1="64" x2="74" y2="64" stroke="#38bdf8" stroke-width="2"/>
  <line x1="42" y1="80" x2="78" y2="80" stroke="#38bdf8" stroke-width="2"/>
  <line x1="38" y1="96" x2="82" y2="96" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Diagonal Lattice Truss -->
  <line x1="50" y1="48" x2="74" y2="64" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="70" y1="48" x2="46" y2="64" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="46" y1="64" x2="78" y2="80" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="74" y1="64" x2="42" y2="80" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="42" y1="80" x2="82" y2="96" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="78" y1="80" x2="38" y2="96" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Antenna Platform & Spire -->
  <rect x="50" y="34" width="20" height="4" rx="2" fill="#38bdf8"/>
  <line x1="60" y1="16" x2="60" y2="34" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Transmitter Beacon Light -->
  <circle cx="60" cy="15" r="4.5" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="60" cy="15" r="2" fill="#ffffff"/>

  <!-- Microwave Dish Left -->
  <path d="M 47 42 Q 41 46 47 50" fill="none" stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="46" x2="52" y2="46" stroke="#e0e7ff" stroke-width="2"/>

  <!-- Microwave Dish Right -->
  <path d="M 73 54 Q 79 58 73 62" fill="none" stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="58" x2="68" y2="58" stroke="#e0e7ff" stroke-width="2"/>
</svg>
